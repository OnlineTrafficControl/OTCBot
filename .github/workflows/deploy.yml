name: Deploy | OTCBot

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          zip -r otc-bot.zip otc_bot requirements.txt \
            -x "*/__pycache__/*" "*.pyc"

      - name: Upload and restart OTCBot
        uses: rexlManu/pterodactyl-upload-action@v2.5
        with:
          panel-host: https://panel.waifly.com
          api-key: ${{ secrets.WAIFLY_UPLOAD_KEY }}
          server-id: ${{ secrets.WAIFLY_SERVER_ID }}
          source: otc-bot.zip
          target: ./
          decompress-target: true
          restart: true

name: Deploy | OTCBot

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create deployment archive
        run: |
          zip -r otc-bot.zip otc_bot requirements.txt \
            -x "*/__pycache__/*" "*.pyc"

      - name: Upload OTCBot over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.WAIFLY_SFTP_HOST }}
          port: ${{ secrets.WAIFLY_SFTP_PORT }}
          username: ${{ secrets.WAIFLY_SFTP_USERNAME }}
          password: ${{ secrets.WAIFLY_SFTP_PASSWORD }}
          local_path: "./otc-bot.zip"
          remote_path: "/"
          sftp_only: true
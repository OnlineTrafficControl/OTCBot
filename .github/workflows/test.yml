name: Test | OTCBot

permissions:
  contents: read

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Test with pytest
        env:
          ADMIN_ROLE_ID: ${{ vars.ADMIN_ROLE_ID }}
          CO_OWNER_ROLE_ID: ${{ vars.CO_OWNER_ROLE_ID }}
          EXEC_ADMIN_ROLE_ID: ${{ vars.EXEC_ADMIN_ROLE_ID }}
          EXEC_MOD_ROLE_ID: ${{ vars.EXEC_MOD_ROLE_ID }}
          MOD_ROLE_ID: ${{ vars.MOD_ROLE_ID }}
          OTC_SERVER_ID: ${{ vars.OTC_SERVER_ID }}
          OWNER_ROLE_ID: ${{ vars.OWNER_ROLE_ID }}
          OWNER_USER_ID: ${{ vars.OWNER_USER_ID }}
          TEST_SERVER_ID: ${{ vars.TEST_SERVER_ID }}
          TICKET_CATEGORY_ID: ${{ vars.TICKET_CATEGORY_ID }}
          TICKET_CATEGORY_NAME: ${{ vars.TICKET_CATEGORY_NAME }}

          OTC_BOT_TOKEN: ${{ secrets.OTC_BOT_TOKEN }}
        run: |
          python -m pytest tests/ \
            --cov=otc_bot \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
